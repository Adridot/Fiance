# Cache policy mirrors dist/_headers (Cloudflare Pages) — computed once so that
# a single server-level add_header applies everywhere (add_header inside a
# location would silently drop the server-level security headers).
# Le flux d'événements SSE ne doit traverser AUCUN tampon.
#
# `fiance-sync` répond déjà `X-Accel-Buffering: no`, mais nginx CONSOMME cet
# en-tête au lieu de le relayer : le proxy d'entrée (Nginx Proxy Manager, un
# second nginx devant celui-ci) ne le voit jamais et bufferise la réponse. Le
# flux reste alors coincé dans son tampon — le client n'obtient même pas les
# en-têtes, et la route passe pour injoignable alors qu'elle répond 200.
#
# On le RÉÉMET donc ici, à destination du proxy d'entrée. Par `map` plutôt que
# par un `add_header` dans `location /sync/` : un `add_header` en location
# écraserait silencieusement les en-têtes de sécurité posés au niveau serveur
# (voir le commentaire ci-dessous). Une valeur vide n'ajoute pas d'en-tête, donc
# seule la route du flux est concernée.
map $uri $fiance_no_buffer {
    default                       "";
    ~^/sync/v1/[^/]+/events$      "no";
}

map $uri $fiance_cache {
    default                 "public, max-age=300";
    # Le serveur de sync ne se met JAMAIS en cache.
    #
    # Le `default` ci-dessus vient de dist/_headers, écrit pour un site
    # statique — mais il s'applique aussi à /sync/, qui est une API. Or
    # `batchPull` du client Starfish est la SEULE lecture qui n'émet pas
    # `cache: "no-store"` (`pull` le fait), et c'est précisément celle qui
    # rapatrie les documents de collection : les 352 invités en un seul
    # `GET /sync/v1/dk/batch/pull`, à URL rigoureusement identique d'une fois
    # sur l'autre. Le navigateur la servait donc depuis son disque pendant cinq
    # minutes, et toute hydratation dans cette fenêtre RÉAPPLIQUAIT un
    # instantané d'avant la dernière écriture — l'app annulait à l'écran une
    # modification pourtant bien enregistrée sur le serveur. Le rechargement
    # forcé n'y changeait rien : il ne porte pas sur les `fetch()` du JS.
    # Constaté le 21 août 2026, onze hydratations pour un seul aller au serveur.
    #
    # `public` était en prime une mauvaise intention sur une API authentifiée.
    ~^/sync/                "no-store";
    ~^/_expo/               "public, max-age=31536000, immutable";
    ~^/assets/              "public, max-age=31536000, immutable";
    ~*\.html$               "no-cache";
    /sw.js                  "no-cache";
    /manifest.json          "public, max-age=86400";
    /robots.txt             "public, max-age=86400";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Real client IP arrives from Nginx Proxy Manager
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # NPM termine le TLS : nginx ne voit que du http et construirait donc des
    # Location absolues en http://, ce qui dégraderait chaque redirection
    # marketing de HTTPS vers HTTP. En relatif, le navigateur conserve le schéma.
    absolute_redirect off;

    charset utf-8;
    charset_types text/css application/javascript application/json;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml
               application/xml text/xml;

    # dist/_headers
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(self), microphone=(), geolocation=()" always;
    add_header Cache-Control           $fiance_cache always;
    add_header X-Accel-Buffering       $fiance_no_buffer always;

    # ── dist/_redirects ──────────────────────────────────────────────────
    # Legacy flat .html paths first — order is significant, as on Pages.
    rewrite ^/blog/(.*)\.html$     /fr/blog/$1     permanent;
    rewrite ^/tools/(.*)\.html$    /fr/tools/$1    permanent;
    rewrite ^/feature/(.*)\.html$  /fr/feature/$1  permanent;
    rewrite ^/privacy\.html$       /fr/privacy     permanent;
    rewrite ^/terms\.html$         /fr/terms       permanent;
    # Unprefixed marketing URLs → default (French) locale
    rewrite ^/blog(/.*)?$          /fr/blog$1      permanent;
    rewrite ^/feature(/.*)?$       /fr/feature$1   permanent;
    rewrite ^/tools(/.*)?$         /fr/tools$1     permanent;
    rewrite ^/privacy$             /fr/privacy     permanent;
    rewrite ^/terms$               /fr/terms       permanent;

    # Instance familiale privée : on n'indexe pas. Le robots.txt du build
    # pointe vers fiance.drakkar.software et autorise l'indexation — on le
    # remplace ici plutôt que dans dist/, qui est écrasé à chaque rebuild.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = / { return 302 /fr; }

    # ── Serveur de sync auto-hébergé ────────────────────────────────────
    # Monté sous le même domaine que l'app : same-origin, donc aucun CORS et
    # un seul certificat. Le client vise ${SYNC_URL}/v1/dk/… avec
    # SYNC_URL = https://mariage.didot.io/sync, et le proxy retire le préfixe
    # /sync — ce que le serveur reconstruit correspond alors exactement au
    # chemin que le client a signé (la signature couvre méthode + chemin +
    # hash du corps + hôte).
    location /sync/ {
        proxy_pass http://fiance-sync:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Le mood board pousse des images : la limite doit tenir un objblob.
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }

    # App association files must be served as JSON
    location /.well-known/ {
        default_type application/json;
    }

    # Hashed build output — never falls back to the SPA shell
    location /_expo/ { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }

    # ── Invitation courte : /i/<code> ────────────────────────────────────
    #
    # Ne sert QUE la coquille de l'application. Le dépôt vit à une adresse
    # d'API distincte (/sync/v1/dk/pull/_invite/<code>) : un aperçu de lien qui
    # demande cette page n'obtient donc jamais le dépôt, et ne le consomme pas.
    # `join.html` porte l'écran de jonction, qui lit le code dans le chemin et
    # la clé dans le fragment — lequel n'atteint jamais ce serveur.
    location ~ ^/i/[A-Za-z0-9]+$ {
        try_files "/i/[code].html" /join.html /index.html;
    }

    # ── Expo Router dynamic routes → their [param] export ─────────────────
    location ~ ^/(?:\(tabs\)/)?guests/communication/[^/]+$ {
        try_files $uri $uri.html /guests/communication/[id].html /index.html;
    }
    location ~ ^/(?:\(tabs\)/)?guests/[^/]+$ {
        try_files $uri $uri.html $uri/index.html /guests/[id].html /index.html;
    }
    location ~ ^/(?:\(tabs\)/)?planning/[^/]+$ {
        try_files $uri $uri.html $uri/index.html /planning/[id].html /index.html;
    }
    location ~ ^/ideas/[^/]+$ {
        try_files $uri $uri.html $uri/index.html /ideas/[id].html /index.html;
    }
    location ~ ^/wedding/[^/]+$ {
        try_files $uri $uri.html $uri/index.html /wedding/[id].html /index.html;
    }
    location ~ ^/(?:\(tabs\)/)?vendors/[^/]+/[^/]+$ {
        try_files $uri $uri.html "/vendors/[type]/[id].html" /index.html;
    }
    location ~ ^/(?:\(tabs\)/)?vendors/[^/]+$ {
        try_files $uri $uri.html $uri/index.html "/vendors/[type].html" /index.html;
    }

    # Static export + SPA fallback
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
